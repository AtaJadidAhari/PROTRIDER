# path to output directory to store result files
out_dir: output

# csv input file containing intensities. Columns are samples and rows are proteins.
input_intensities: "sample_data/protrider_sample_dataset.tsv"
split_reads: ["/s/project/py_fraser/exported_counts/fraser8653/subsets/raw-local-subset1_s.csv","/s/project/py_fraser/exported_counts/fraser8653/subsets/raw-local-subset2_s.csv"]
unsplit_reads: ["/s/project/py_fraser/exported_counts/fraser8653/subsets/raw-local-subset1_u.csv","/s/project/py_fraser/exported_counts/fraser8653/subsets/raw-local-subset2_u.csv"]

# column name in the input file indicating the column name containing the protein/gene names/IDs
index_col: "gene_ID"
input_format: "introns_as_rows"

## Preprocessing params
# maximum percentage of missing values per protein
max_allowed_NAs_per_protein: 0.3

analysis: "outrider"
fpkmCutoff: 1
gtf: "/s/genomes/human/hg38/gencode.v34/gencode.v34.annotation.gtf.gz"

# seed parameter for reproducibility
seed: 42

## Grid search outlier injection params
inj_freq: 1e-3
inj_mean: 3
inj_sd: 1.6
gs_epochs: 100

## Model params
# TODO: improve error when set to False and trying to plot trainng_loss
autoencoder_training: True # when set to false, it returns values after (PCA) initialization without training
autoencoder_loss: "NLL" # MSE | NLL | BBL

n_layers: 1 # number of layers for the autoencoder model
n_epochs: 1 # number of training epochs

# TODO: try with higher LR
lr: 1e-4 # learning rate
batch_size:

find_q_method: "OHT" # option to find latent space dimension. Options: OHT, gs or an integer value
init_pca: True # PCA initialization
h_dim: # hidden dimension, only for n_layers>1

## Presence absence modelling
presence_absence: False
lambda_presence_absence: 0.5

## Stat params
pval_dist: 't' # Distribution choice for P-value computation. Options: gaussian, t, nb, bb
pval_adj: 'by' # Multiple testing correction. Options: by, bh, holm
pval_sided: 'two-sided'
calculate_one_sided_pval: False
pseudocount: 0.01 # for FC computation (and jaccard)
min_delta_psi: 0.05  # for fraser jaccard variability filter

## Reporting params
outlier_threshold: 0.1 # for adjusted p values 
delta_psi_threshold : 0.1 # for fraser
min_count : 5 # for fraser
report_all: True 

verbose: False
device: 'cpu'

min_expression_in_one_sample: 20
quantile_min_expression : 10
quantile_for_filtering: 0.75 

n_jobs: 8
